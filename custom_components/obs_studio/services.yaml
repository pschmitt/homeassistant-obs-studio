set_scene:
  name: Set scene
  description: Switch to a specific scene in OBS Studio.
  target:
    entity:
      integration: obs_studio
  fields:
    scene_name:
      name: Scene name
      description: Scene to switch to. Available scenes are fetched from OBS at startup.
      required: true
      example: "Main Scene"
      selector:
        select:
          options: []
          custom_value: true
          mode: dropdown

start_stream:
  name: Start streaming
  description: Start the OBS stream.
  target:
    entity:
      integration: obs_studio

stop_stream:
  name: Stop streaming
  description: Stop the OBS stream.
  target:
    entity:
      integration: obs_studio

toggle_stream:
  name: Toggle streaming
  description: Toggle OBS streaming on or off.
  target:
    entity:
      integration: obs_studio

start_record:
  name: Start recording
  description: Start recording in OBS Studio.
  target:
    entity:
      integration: obs_studio

stop_record:
  name: Stop recording
  description: Stop recording in OBS Studio.
  target:
    entity:
      integration: obs_studio

toggle_record:
  name: Toggle recording
  description: Toggle OBS recording on or off.
  target:
    entity:
      integration: obs_studio

pause_record:
  name: Pause recording
  description: Pause the current OBS recording.
  target:
    entity:
      integration: obs_studio

resume_record:
  name: Resume recording
  description: Resume a paused OBS recording.
  target:
    entity:
      integration: obs_studio

start_virtual_cam:
  name: Start virtual camera
  description: Start the OBS virtual camera.
  target:
    entity:
      integration: obs_studio

stop_virtual_cam:
  name: Stop virtual camera
  description: Stop the OBS virtual camera.
  target:
    entity:
      integration: obs_studio

start_replay_buffer:
  name: Start replay buffer
  description: Start the OBS replay buffer.
  target:
    entity:
      integration: obs_studio

stop_replay_buffer:
  name: Stop replay buffer
  description: Stop the OBS replay buffer.
  target:
    entity:
      integration: obs_studio

save_replay_buffer:
  name: Save replay buffer
  description: Save the current OBS replay buffer clip.
  target:
    entity:
      integration: obs_studio

trigger_hotkey:
  name: Trigger hotkey
  description: Trigger a named OBS hotkey.
  target:
    entity:
      integration: obs_studio
  fields:
    hotkey_name:
      name: Hotkey name
      description: >-
        The OBS hotkey name to trigger (e.g. OBSBasic.StartStreaming,
        OBSBasic.Screenshot). Use the obs.list_hotkeys service to discover names.
      required: true
      example: "OBSBasic.StartStreaming"
      selector:
        text:

set_input_mute:
  name: Set input mute
  description: >-
    Mute or unmute an OBS input, either one named input or the allowed input(s)
    visible on the current program scene. OBS is read back to confirm the change.
  target:
    entity:
      integration: obs_studio
  fields:
    muted:
      name: Muted
      description: Mute the input (true) or unmute it (false).
      required: true
      selector:
        boolean:
    input_name:
      name: Input name
      description: Exact name of one input. Use this or scene inputs, not both.
      example: "Desktop Audio"
      selector:
        text:
    scene_inputs:
      name: Scene inputs
      description: >-
        Allowlist mapping a program scene name to the input names that may be
        changed while that scene is on air. Fails without changes when the
        current scene has no entry or none of its inputs is visible.
      example: '{"Main Scene": ["Media"]}'
      selector:
        object:
    input_kinds:
      name: Input kinds
      description: Only act on inputs of these OBS kinds (version suffixes are ignored).
      example: '["ffmpeg_source", "browser_source"]'
      selector:
        object:

step_input_volume:
  name: Step input volume
  description: >-
    Raise or lower an OBS input volume by a step in dB within bounds, reading the
    current volume from OBS. Stepping down never changes mute.
  target:
    entity:
      integration: obs_studio
  fields:
    direction:
      name: Direction
      description: Raise (up) or lower (down) the volume.
      required: true
      selector:
        select:
          options:
            - up
            - down
    step_db:
      name: Step
      description: Step size in dB.
      required: true
      example: 3
      selector:
        number:
          min: 0.1
          max: 26
          step: 0.1
          unit_of_measurement: dB
    min_db:
      name: Minimum
      description: Lowest volume to step down to.
      default: -100
      selector:
        number:
          min: -100
          max: 26
          step: 0.1
          unit_of_measurement: dB
    max_db:
      name: Maximum
      description: Highest volume to step up to.
      default: 0
      selector:
        number:
          min: -100
          max: 26
          step: 0.1
          unit_of_measurement: dB
    unmute_on_up:
      name: Unmute when raising
      description: Also unmute when the direction is up, even at the maximum volume.
      default: false
      selector:
        boolean:
    input_name:
      name: Input name
      description: Exact name of one input. Use this or scene inputs, not both.
      example: "Desktop Audio"
      selector:
        text:
    scene_inputs:
      name: Scene inputs
      description: >-
        Allowlist mapping a program scene name to the input names that may be
        changed while that scene is on air. Fails without changes when the
        current scene has no entry or none of its inputs is visible.
      example: '{"Main Scene": ["Media"]}'
      selector:
        object:
    input_kinds:
      name: Input kinds
      description: Only act on inputs of these OBS kinds (version suffixes are ignored).
      example: '["ffmpeg_source", "browser_source"]'
      selector:
        object:
